<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Heat Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Vice Heat <span>Studio</span></h1>
    <p>Turn your photos into GTA-style cover art: pick a layout, drop photos into the panels, grade it, sign it.</p>
  </header>
  <main class="workspace">
    <section class="stage-wrap">
      <div class="stage-bar">
        <span class="stage-label">Preview</span>
        <div id="aspectButtons" class="seg" role="group" aria-label="Preview aspect"></div>
      </div>
      <canvas id="stage" width="880" height="880" aria-label="Cover preview"></canvas>
      <p id="status" class="hint" role="status"></p>
    </section>
    <aside class="panel">
      <section class="group">
        <h2>Photos</h2>
        <label class="file-btn">Add your photos
          <input id="photoInput" type="file" accept="image/*" multiple hidden>
        </label>
        <div id="thumbs" class="thumbs"></div>
        <p class="note">Click a panel on the cover to select it, then click a photo to put it in. Drag on the cover to reposition.</p>
      </section>
      <section class="group">
        <h2>Layout</h2>
        <div id="layoutButtons" class="seg wrap" role="group" aria-label="Layout"></div>
        <label class="check"><input id="goldFrame" type="checkbox"> Gold frame
          <span class="note">— a heavy gold frame on the hero panel</span></label>
      </section>
      <section class="group">
        <h2>Grade</h2>
        <div id="gradeButtons" class="seg wrap" role="group" aria-label="Colour grade"></div>
      </section>
      <section class="group">
        <h2 id="panelLabel">Panel</h2>
        <label class="slider">Zoom
          <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1">
        </label>
        <button id="autoframe" type="button" class="wide">Auto-frame on the face</button>
      </section>
      <section class="group">
        <h2>Caption</h2>
        <label>Title <input id="captionInput" type="text" maxlength="40" value="VICE HEAT"></label>
        <label>Cast line <input id="taglineInput" type="text" maxlength="60" value="MARA • JAX • VALENTINA"></label>
        <label>Position
          <select id="posSelect">
            <option value="bottom">Bottom</option>
            <option value="top">Top</option>
          </select>
        </label>
      </section>
      <section class="group">
        <h2>Export</h2>
        <div id="exportButtons" class="stack"></div>
      </section>
    </aside>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
